name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-moonbit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check formatting
        if: runner.os == 'Linux'
        run: moon fmt --check
      - name: Type check all backends
        run: moon check --target all
      - name: Test wasm-gc
        run: moon test --target wasm-gc
      - name: Test wasm
        run: moon test --target wasm
      - name: Test JS
        run: moon test --target js
      - name: Test native
        run: moon test --target native
      - name: Verify generated interfaces are current
        if: runner.os == 'Linux'
        run: |
          moon info
          test -z "$(git status --porcelain -- '*.mbti')"
      - name: Build native CLI
        run: moon build cmd/moonqr --target native --release
      - name: CLI smoke tests
        run: python3 tools/cli/smoke.py

  size:
    name: Artifact size budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-moonbit
      - name: Build release artifacts
        run: |
          moon build js --target wasm-gc --release
          moon build js --target js --release
          moon build cmd/moonqr --target native --release
      - name: Enforce size budgets
        run: |
          set -euo pipefail
          wasm_raw=$(stat -c%s _build/wasm-gc/release/build/js/js.wasm)
          wasm_gz=$(gzip -c _build/wasm-gc/release/build/js/js.wasm | wc -c)
          js_raw=$(stat -c%s _build/js/release/build/js/js.js)
          js_gz=$(gzip -c _build/js/release/build/js/js.js | wc -c)
          cli=$(find _build/native/release/build/cmd/moonqr -maxdepth 1 -type f \( -name moonqr -o -name moonqr.exe \) | head -n 1)
          cli_size=$(stat -c%s "$cli")
          echo "wasm-gc: ${wasm_raw} B raw / ${wasm_gz} B gzip (limit 20 KiB gzip)"
          echo "JS:      ${js_raw} B raw / ${js_gz} B gzip (limit 30 KiB gzip)"
          echo "CLI:     ${cli_size} B (limit 2 MiB)"
          test "$wasm_gz" -le $((20 * 1024))
          test "$js_gz" -le $((30 * 1024))
          test "$cli_size" -le $((2 * 1024 * 1024))

  zxing:
    name: ZXing decode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-moonbit
      - name: Build CLI
        run: moon build cmd/moonqr --target native --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/zxing/package-lock.json
      - name: Install decoder
        run: npm ci --prefix tools/zxing
      - name: Decode generated symbols
        run: node tools/zxing/verify.js

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-moonbit
      - name: Run coverage
        run: moon coverage analyze -- -f cobertura -o coverage.xml
      - name: Enforce core coverage
        run: python3 tools/check_coverage.py coverage.xml

  npm:
    name: npm wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-moonbit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix npm
      - name: Smoke tests and type check
        run: npm test --prefix npm
      - name: Validate package contents
        run: npm run pack:check --prefix npm

  fuzz:
    name: Reference cross-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-moonbit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reference encoder
        run: pip install -r tools/fuzz/requirements.txt
      - name: Build CLI
        run: moon build cmd/moonqr --target native --release
      - name: Compare matrices with Python qrcode
        run: python3 tools/fuzz/verify.py

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-moonbit
      - name: Run native benchmark suite
        run: moon bench benchmarks --target native --release

  prove:
    name: Formal contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-moonbit
      - name: Install SMT solver
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
          z3 --version
      - name: Prove capacity contracts
        run: moon prove core/capacity_model
